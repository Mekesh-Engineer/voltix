<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UISOCIAL - Premium Login</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#F04438',
                        ink: '#202020',
                        muted: '#777777',
                        border: '#D6D6D6',
                        bgLight: '#EEEEEE'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #EEEEEE;
            overflow-x: hidden;
        }

        /* Custom clip-path for the slanted artwork boundary */
        .artwork-clip {
            clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
        }

        /* Custom transitions for the carousel */
        .fade-enter {
            opacity: 0;
            transition: opacity 400ms ease-in-out;
        }
        .fade-active {
            opacity: 1;
        }

        /* Custom focus ring for inputs */
        .input-focus:focus {
            outline: none;
            border-color: #F04438;
            box-shadow: 0 0 0 2px rgba(240, 68, 56, 0.1);
        }

        /* Hide scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .toast-animation {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- Full Page Background Artwork (Desktop) -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1920&q=80" 
             alt="Atmospheric Background" 
             class="w-full h-full object-cover object-left opacity-40 md:opacity-100">
        <div class="absolute inset-0 bg-gradient-to-r from-black/60 via-transparent to-bgLight/20"></div>
    </div>

    <!-- Main Authentication Card -->
    <main class="relative z-10 w-full max-w-[1140px] h-auto lg:h-[820px] bg-white rounded-[48px] shadow-[0_20px_60px_rgba(0,0,0,0.12)] overflow-hidden grid grid-cols-1 lg:grid-cols-[54%_46%]">
        
        <!-- Left Visual Panel -->
        <section class="relative p-3 lg:p-4 h-full">
            <div class="relative w-full h-full rounded-[40px] overflow-hidden artwork-clip bg-ink">
                <!-- Carousel Image -->
                <img id="carousel-img" src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&w=1000&q=80" 
                     class="w-full h-full object-cover transition-opacity duration-500" alt="Featured Work">

                <!-- Left Panel Top Nav -->
                <div class="absolute top-[45px] left-[50px] right-[50px] flex justify-between items-center">
                    <span class="text-white font-semibold text-[18px]">Selected Works</span>
                    <div class="flex items-center gap-6">
                        <a href="#" class="text-white text-[14px] font-medium hover:opacity-80 transition-opacity">Sign Up</a>
                        <button class="border border-white text-white rounded-full px-6 py-2 text-[14px] font-medium w-[95px] h-[40px] hover:bg-white/10 transition-all">
                            Join Us
                        </button>
                    </div>
                </div>

                <!-- Left Panel Artist Info -->
                <div class="absolute bottom-[45px] left-[48px] flex items-center gap-3">
                    <img src="https://i.pravatar.cc/150?u=andrew" alt="Andrew.ui" class="w-12 h-12 rounded-full border-2 border-white/20">
                    <div class="flex flex-col">
                        <span class="text-white font-bold text-[18px] leading-tight">Andrew.ui</span>
                        <span class="text-white/80 text-[15px] leading-tight">UI & Illustration</span>
                    </div>
                </div>

                <!-- Carousel Controls -->
                <div class="absolute bottom-[42px] right-[42px] flex gap-2">
                    <button onclick="prevSlide()" class="w-10 h-10 rounded-full border border-white/30 flex items-center justify-center text-white hover:bg-white/20 transition-all">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button onclick="nextSlide()" class="w-10 h-10 rounded-full border border-white/30 flex items-center justify-center text-white hover:bg-white/20 transition-all">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Right Authentication Panel -->
        <section class="flex flex-col p-6 md:p-12 lg:px-20 lg:py-12 justify-between relative bg-white">
            
            <!-- Brand Header -->
            <div class="flex justify-between items-start">
                <h1 class="text-ink font-extrabold text-2xl lg:text-3xl tracking-tighter">UISOCIAL</h1>
                
                <!-- Language Selector -->
                <div class="relative">
                    <button id="lang-btn" class="flex items-center justify-between w-[100px] h-[42px] px-3 border border-border rounded-full text-sm font-medium text-ink hover:bg-gray-50 transition-all">
                        <span class="flex items-center gap-2">🇬🇧 <span id="current-lang">EN</span></span>
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                    <!-- Dropdown -->
                    <div id="lang-dropdown" class="hidden absolute right-0 mt-2 w-32 bg-white border border-border rounded-xl shadow-lg z-50 py-2">
                        <a href="#" onclick="changeLang('English')" class="block px-4 py-2 text-sm hover:bg-gray-100">English</a>
                        <a href="#" onclick="changeLang('Tamil')" class="block px-4 py-2 text-sm hover:bg-gray-100">Tamil</a>
                        <a href="#" onclick="changeLang('Hindi')" class="block px-4 py-2 text-sm hover:bg-gray-100">Hindi</a>
                    </div>
                </div>
            </div>

            <!-- Login Form Area -->
            <div class="flex flex-col items-center w-full max-w-md mx-auto mt-12 lg:mt-0">
                <div class="text-center mb-10">
                    <h2 class="text-ink font-extrabold text-4xl md:text-5xl lg:text-[56px] leading-[1.05] mb-4">Hi Designer</h2>
                    <p class="text-muted text-base">Welcome to UISOCIAL</p>
                </div>

                <form id="auth-form" class="w-full space-y-4" onsubmit="handleAuth(event)">
                    <!-- Email -->
                    <div class="space-y-1">
                        <input type="email" id="email" required placeholder="Email" 
                               class="w-full h-12 px-4 border border-border rounded-[10px] text-sm input-focus transition-all"
                               autocomplete="email">
                    </div>

                    <!-- Password -->
                    <div class="relative space-y-1">
                        <div class="relative">
                            <input type="password" id="password" required placeholder="Password" 
                                   class="w-full h-12 px-4 border border-border rounded-[10px] text-sm input-focus transition-all"
                                   autocomplete="current-password">
                            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink transition-colors">
                                <i id="eye-icon" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="flex justify-end">
                            <button type="button" onclick="forgotPassword()" class="text-brand text-[12px] font-medium hover:underline transition-all">
                                Forgot password ?
                            </button>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="flex items-center gap-4 py-4">
                        <div class="h-px bg-border flex-1"></div>
                        <span class="text-muted text-xs">or</span>
                        <div class="h-px bg-border flex-1"></div>
                    </div>

                    <!-- Google Login -->
                    <button type="button" onclick="googleLogin()" class="w-full h-12 border border-border rounded-[9px] flex items-center justify-center gap-3 text-sm text-ink hover:bg-gray-50 transition-all">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c3.18 0 5.84-1.05 7.76-2.87l-3.57-2.77c-1 .67-2.28 1.06-3.57 1.06-2.73 0-5.03-1.85-5.84-4.31H.43v2.84C2.35 21.33 7.31 23 12 23z"/>
                            <path fill="#FBBC05" d="M6.16 14.75c-.2-.59-.34-1.22-.34-1.85s.14-1.26.34-1.85V6.16H.43c-.55 1.31-.86 2.73-.86 4.2s.31 2.89.86 4.2l5.73-4.4z"/>
                            <path fill="#EA4335" d="M12 4.31c1.55 0 2.93.53 4.06 1.58l3.06-3.06C17.84 1.05 15.18 0 12 0 7.31 0 2.35 1.67.43 4.4l5.73 4.4c.81-2.46 3.11-4.31 5.84-4.31z"/>
                        </svg>
                        Login with Google
                    </button>

                    <!-- Primary Login -->
                    <button type="submit" id="submit-btn" class="w-full h-12 bg-brand text-white rounded-full font-semibold text-sm hover:bg-red-600 active:scale-[0.98] transition-all flex items-center justify-center">
                        <span id="btn-text">Login</span>
                        <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    </button>
                </form>

                <!-- Sign Up Prompt -->
                <p class="mt-6 text-xs text-muted">
                    Don't have an account? 
                    <a href="#" onclick="toggleAuthMode()" class="text-brand font-medium hover:underline">Sign up</a>
                </p>
            </div>

            <!-- Social Icons -->
            <div class="flex justify-center gap-6 mt-auto">
                <a href="#" class="text-muted hover:text-ink transition-all hover:scale-110">
                    <i data-lucide="facebook" class="w-5 h-5"></i>
                </a>
                <a href="#" class="text-muted hover:text-ink transition-all hover:scale-110">
                    <i data-lucide="twitter" class="w-5 h-5"></i>
                </a>
                <a href="#" class="text-muted hover:text-ink transition-all hover:scale-110">
                    <i data-lucide="linkedin" class="w-5 h-5"></i>
                </a>
                <a href="#" class="text-muted hover:text-ink transition-all hover:scale-110">
                    <i data-lucide="instagram" class="w-5 h-5"></i>
                </a>
            </div>
        </section>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3"></div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // --- Carousel Logic ---
        const slides = [
            {
                image: "https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&w=1000&q=80",
                author: "Andrew.ui",
                category: "UI & Illustration"
            },
            {
                image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1000&q=80",
                author: "Sarah.design",
                category: "Digital Art"
            },
            {
                image: "https://images.unsplash.com/photo-1534972195531-d756n256f9679?auto=format&fit=crop&w=1000&q=80",
                author: "Marcus.vfx",
                category: "3D Environment"
            }
        ];
        let currentSlide = 0;
        const carouselImg = document.getElementById('carousel-img');

        function updateSlide() {
            carouselImg.style.opacity = 0;
            setTimeout(() => {
                carouselImg.src = slides[currentSlide].image;
                carouselImg.style.opacity = 1;
            }, 300);
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide();
        }

        // --- Password Toggle ---
        function togglePassword() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // --- Language Dropdown ---
        const langBtn = document.getElementById('lang-btn');
        const langDropdown = document.getElementById('lang-dropdown');
        const currentLangText = document.getElementById('current-lang');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('hidden');
        });

        window.addEventListener('click', () => langDropdown.classList.add('hidden'));

        function changeLang(lang) {
            currentLangText.innerText = lang === 'English' ? 'EN' : lang.substring(0, 2).toUpperCase();
            showToast(`Language changed to ${lang}`);
        }

        // --- Toast System ---
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "toast-animation bg-white px-5 py-3 rounded-xl shadow-lg border border-gray-100 text-sm text-ink font-medium flex items-center gap-3";
            toast.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i> ${message}`;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // --- Auth Logic ---
        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const submitBtn = document.getElementById('submit-btn');

            if (!email.includes('@')) {
                showToast("Please enter a valid email");
                return;
            }
            if (password.length < 6) {
                showToast("Password must be at least 6 characters");
                return;
            }

            // Loading state
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;

            setTimeout(() => {
                btnText.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
                showToast("Login successful! Redirecting...");
            }, 1500);
        }

        function googleLogin() {
            showToast("Google authentication selected.");
        }

        function forgotPassword() {
            showToast("Password reset link requested.");
        }

        function toggleAuthMode() {
            showToast("Switching to Registration mode...");
            // In a real app, we would swap the form fields here.
        }
    </script>
</body>
</html>
